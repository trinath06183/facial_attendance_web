{% extends 'base.html' %}
{% block title %}Attendance Reports — SmartAttend{% endblock %}

{% block content %}
<div class="min-h-screen bg-white p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-gray-900">Custom Attendance Reports</h1>
            <p class="text-gray-500 mt-1">Configure your filters below to generate specific logs.</p>
        </header>

        <form id="filter-form" class="bg-gray-50 p-8 rounded-3xl border border-gray-100 mb-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="space-y-2 md:col-span-5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">Date Range</label>
                    <div class="flex items-center gap-2">
                        <input type="date" name="start_date" id="start_date"
                            class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <span class="text-gray-400">to</span>
                        <input type="date" name="end_date" id="end_date"
                            class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="button" onclick="setToday()"
                        class="text-[10px] font-bold text-blue-600 hover:underline px-1 mt-1 block">
                        Select Today: {{ current_date }}
                    </button>
                </div>

                <div class="space-y-2 md:col-span-5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest px-1">Search
                        Student</label>
                    <input type="text" name="student_query" id="student_query" placeholder="Name or Roll Number..."
                        class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex items-center md:col-span-2 pt-6">
                    <button type="button" onclick="clearFilters()"
                        class="w-full p-3 text-gray-500 hover:text-gray-900 bg-white border border-gray-200 hover:border-gray-400 text-sm font-semibold transition-all rounded-xl shadow-sm whitespace-nowrap">
                        Reset All Filters
                    </button>
                </div>
            </div>
        </form>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <button onclick="downloadReport('csv')"
                class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm hover:shadow-md transition-all flex items-center gap-6 group">
                <div
                    class="w-14 h-14 bg-green-50 rounded-2xl flex items-center justify-center text-green-600 group-hover:bg-green-600 group-hover:text-white transition-all">
                    <i class="fas fa-file-csv text-2xl"></i>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-gray-800">Export as CSV</h3>
                    <p class="text-xs text-gray-400">Perfect for Excel analysis</p>
                </div>
            </button>

            <button onclick="downloadReport('pdf')"
                class="p-6 bg-white border border-gray-100 rounded-3xl shadow-sm hover:shadow-md transition-all flex items-center gap-6 group">
                <div
                    class="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition-all">
                    <i class="fas fa-file-pdf text-2xl"></i>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-gray-800">Export as PDF</h3>
                    <p class="text-xs text-gray-400">Official formatted document</p>
                </div>
            </button>
        </div>
    </div>
</div>

<script>
    function setToday() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('start_date').value = today;
        document.getElementById('end_date').value = today;
    }

    function clearFilters() {
        document.getElementById('filter-form').reset();
    }

    function downloadReport(format) {
        const start = document.getElementById('start_date').value;
        const end = document.getElementById('end_date').value;
        const query = document.getElementById('student_query').value;

        // Build the dynamic URL with parameters
        let baseUrl = format === 'csv' ? '{% url "export_csv" %}' : '{% url "export_pdf" %}';
        const params = new URLSearchParams({
            start_date: start,
            end_date: end,
            student_query: query
        });

        window.location.href = `${baseUrl}?${params.toString()}`;
    }
</script>
{% endblock %}
