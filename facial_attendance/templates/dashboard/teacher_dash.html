{% extends 'base.html' %}
{% block content %}
<div class="p-8 bg-white min-h-screen">
    <header class="flex justify-between items-center mb-10">
        <div>
            <h1 class="text-3xl font-black text-gray-900">Faculty Portal</h1>
            <p class="text-gray-400 text-sm">Manage class attendance and view logs.</p>
        </div>
        <div class="flex gap-3">
            <a href="{% url 'face_scan' %}" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold"><i
                    class="fas fa-video mr-1"></i> Start Recognition</a>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-gray-50 rounded-3xl p-8 border border-gray-100">
            <h3 class="font-bold text-gray-800 mb-6">Class Management</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <a href="{% url 'view_all_students' %}"
                    class="p-6 bg-white rounded-2xl border border-gray-100 hover:border-blue-500 transition-all group">
                    <i class="fas fa-users text-blue-500 mb-3 text-xl"></i>
                    <p class="font-bold text-gray-900">View All Students</p>
                    <p class="text-xs text-gray-400">Student Directory</p>
                </a>
                <a href="{% url 'manual_attendance' %}"
                    class="p-6 bg-white rounded-2xl border border-gray-100 hover:border-indigo-500 transition-all group">
                    <i class="fas fa-edit text-indigo-500 mb-3 text-xl"></i>
                    <p class="font-bold text-gray-900">Manual Attendance</p>
                    <p class="text-xs text-gray-400">Override records</p>
                </a>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-sm">
            <h3 class="font-bold text-gray-800 mb-6">Reports & Logs</h3>
            <div class="space-y-3">
                <a href="{% url 'todays_attendance' %}"
                    class="block p-4 bg-gray-50 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-calendar-check mr-2 text-gray-400"></i> View Attendance
                </a>
                <a href="{% url 'export_reports_page' %}"
                    class="block p-4 bg-blue-50 rounded-xl text-sm font-bold text-blue-600">
                    <i class="fas fa-file-export mr-2"></i> Export Reports
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
